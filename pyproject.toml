[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ghoul-quiz-lib"
version = "0.2.0"
description = "Async Python library for Questions Ghoul API"
readme = "LIBRARY_README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CheStor", email = "selftopic@gmail.com"}
]
keywords = ["async", "api", "ghoul", "quiz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
]

[project.scripts]
ghoul-quiz-register = "ghoul_quiz.register:main"

[project.urls]
Source = "https://github.com/chestor-cz/ghoul_quiz_lib"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
]

[tool.poetry]
packages = [{include = "ghoul_quiz"}]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
